# Ogni ora: scarica le notizie e ripubblica il sito su GitHub Pages.
name: Aggiorna notizie

on:
  schedule:
    - cron: "5 * * * *"    # al minuto 5 di ogni ora (orario UTC)
  workflow_dispatch:        # pulsante "Run workflow" per lanciarlo a mano
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recupera le traduzioni già fatte
        uses: actions/cache@v4
        with:
          path: cache
          key: traduzioni-${{ github.run_id }}
          restore-keys: traduzioni-
      - name: Scarica e traduce le notizie
        run: python fetch_news.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
